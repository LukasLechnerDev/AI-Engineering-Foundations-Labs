[project]
name = "ai-engineering-foundations-labs"
version = "0.1.0"
description = "Companion project for the AI Engineering Fundamentals course"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.2.0",
    "openai>=2.29.0",
    "pandas>=2.3.3",
    "python-jobspy>=1.1.82",
    "requests>=2.33.0",
    "resend>=2.0.0",
    "tiktoken>=0.12.0",
    "pydantic>=2.12.5",
    "pymupdf4llm>=1.27.2.3",
    "plotly>=6.3.0",
    "langchain>=0.3.27",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.3.30",
    "langchain-core>=0.3.76",
    "langchain-openai>=0.3.33",
    "langchain-text-splitters>=0.3.11",
    "langchain-huggingface>=1.0.0",
    "chromadb>=1.1.0",
    "sentence-transformers>=5.1.1",
    "scikit-learn>=1.7.2",
    "nbformat>=5.11.1",
    "gradio>=6.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
