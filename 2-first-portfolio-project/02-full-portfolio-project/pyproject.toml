[project]
name = "02-full-portfolio-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-jobspy>=1.1.80",
    "resend>=2.0.0",
]

[tool.uv]
# Supply-chain safety:
# "uv add" pins an exact version instead of a ">=" range.
add-bounds = "exact"
# Only consider releases that are at least 7 days old.
# A compromised release is usually pulled from PyPI within a few days.
exclude-newer = "7 days"
